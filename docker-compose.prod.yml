# Visite Notify — Production Docker stack (Phase 10–12)
# Local/dev uses docker-compose.yml; this file is VPS-only.
#
# Usage:
#   cp .env.docker.example .env.docker && chmod 600 .env.docker
#   docker compose -f docker-compose.prod.yml --env-file .env.docker up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.docker exec app php artisan migrate --force

name: visite-notify

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-runtime: &app-runtime
  image: visite-notify-app:latest
  working_dir: /var/www/html
  env_file:
    - .env.docker
  volumes:
    - storage_data:/var/www/html/storage
  networks:
    - visite_notify
  logging: *default-logging
  restart: unless-stopped

services:
  app:
    <<: *app-runtime
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app-production
    container_name: visite-notify-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$s=@fsockopen(\"127.0.0.1\",9000); exit($$s?0:1);'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 256m

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx-production
    image: visite-notify-nginx:latest
    container_name: visite-notify-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_HTTP_PORT:-8084}:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/up >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - visite_notify
    cpus: 0.50
    mem_limit: 128m
    mem_reservation: 64m

  mysql:
    image: mysql:8.4
    container_name: visite-notify-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/visite-notify.cnf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging
    networks:
      - visite_notify
    cpus: 1.0
    mem_limit: 768m
    mem_reservation: 384m

  redis:
    image: redis:7-alpine
    container_name: visite-notify-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks:
      - visite_notify
    cpus: 0.25
    mem_limit: 160m
    mem_reservation: 64m

  # Large CSV imports stay here so notification sends are not blocked.
  worker:
    <<: *app-runtime
    container_name: visite-notify-worker
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "redis",
        "--queue=imports,default",
        "--sleep=3",
        "--tries=3",
        "--timeout=3600",
        "--memory=512",
        "--max-time=3600",
        "--no-interaction",
      ]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r 'exit(is_readable(\"/proc/1/cmdline\") && str_contains(@file_get_contents(\"/proc/1/cmdline\") ?: \"\", \"queue:work\") ? 0 : 1);'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cpus: 1.0
    mem_limit: 768m
    mem_reservation: 256m

  worker-notifications:
    <<: *app-runtime
    container_name: visite-notify-worker-notifications
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "redis",
        "--queue=notifications,webhooks",
        "--sleep=1",
        "--tries=3",
        "--timeout=120",
        "--memory=256",
        "--max-time=3600",
        "--no-interaction",
      ]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r 'exit(is_readable(\"/proc/1/cmdline\") && str_contains(@file_get_contents(\"/proc/1/cmdline\") ?: \"\", \"queue:work\") ? 0 : 1);'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cpus: 0.50
    mem_limit: 384m
    mem_reservation: 128m

  scheduler:
    <<: *app-runtime
    container_name: visite-notify-scheduler
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r 'exit(is_readable(\"/proc/1/cmdline\") && str_contains(@file_get_contents(\"/proc/1/cmdline\") ?: \"\", \"schedule:work\") ? 0 : 1);'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 96m

networks:
  visite_notify:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
