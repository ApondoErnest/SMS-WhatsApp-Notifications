# Visite Notify — Production Docker stack
# Usage on VPS:
#   cp .env.docker.example .env.docker   # then edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.docker up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.docker exec app php artisan migrate --force
#   docker compose -f docker-compose.prod.yml --env-file .env.docker exec app php artisan db:seed --class=RoleAndPermissionSeeder --force

name: visite-notify

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app-production
    image: visite-notify-app:latest
    container_name: visite-notify-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visite_notify

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx-production
    image: visite-notify-nginx:latest
    container_name: visite-notify-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_HTTP_PORT:-8084}:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - visite_notify

  mysql:
    image: mysql:8.4
    container_name: visite-notify-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - visite_notify

  redis:
    image: redis:7-alpine
    container_name: visite-notify-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - visite_notify

  worker:
    image: visite-notify-app:latest
    container_name: visite-notify-worker
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "redis",
        "--queue=imports,notifications,webhooks,default",
        "--sleep=3",
        "--tries=3",
        "--timeout=3600",
        "--max-time=3600",
        "--no-interaction",
      ]
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - visite_notify

  scheduler:
    image: visite-notify-app:latest
    container_name: visite-notify-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - visite_notify

networks:
  visite_notify:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
